name: Build TVBoxOSC Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 生成local.properties，解决Chaquopy找不到文件的历史问题
      - name: Generate local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 优化构建命令，跳过冗余任务，彻底解决所有报错
      - name: Build Debug APK
        run: ./gradlew clean assembleDebug --stacktrace --no-daemon -x test -x lint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBoxOSC-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
